# Deploy otomatis LONJOBOKO-RESCUE
#
# Hosting tidak membuka akses SSH dari luar, jadi deploy memakai pola "jemput":
#   1. Push ke branch `production`.
#   2. GitHub menjalankan tes dan build tampilan.
#   3. Hasilnya (kode + public/build) disimpan ke branch `deploy`.
#   4. Cron Job di server menjalankan deploy/server-deploy.sh tiap 5 menit,
#      dan memperbarui web kalau ada versi baru di branch `deploy`.
#
# Notifikasi Telegram (opsional), isi di Settings → Secrets and variables → Actions:
#   TELEGRAM_BOT_TOKEN   token dari @BotFather
#   TELEGRAM_CHAT_ID     chat ID pribadi atau grup
#
# Panduan lengkap: docs/DEPLOY.md

name: Deploy ke hosting

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Tes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, zip, gd, fileinfo
          coverage: none

      - name: Pasang paket Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env tes
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan tes
        run: php artisan test

  build:
    name: Build ke branch deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build tampilan
        run: |
          npm ci
          npm run build

      - name: Simpan ke branch deploy
        run: |
          subject="$(git log -1 --pretty=%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B deploy
          git add -f public/build
          git commit -q -m "Deploy ${GITHUB_SHA::7}: ${subject}"
          git push -f origin deploy

  notify:
    name: Kabari Telegram
    needs: [test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim notifikasi
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Secret Telegram belum diisi, notifikasi dilewati."
            exit 0
          fi

          short_sha="${GITHUB_SHA::7}"
          subject="$(printf '%s' "$COMMIT_MSG" | head -n 1)"

          if [ "$TEST_RESULT" != "success" ]; then
            text="❌ LONJOBOKO-RESCUE: tes gagal, deploy dibatalkan.
          Commit: ${short_sha} · ${subject}
          Web live tidak berubah.
          Log: ${RUN_URL}"
          elif [ "$BUILD_RESULT" != "success" ]; then
            text="❌ LONJOBOKO-RESCUE: build tampilan gagal, deploy dibatalkan.
          Commit: ${short_sha} · ${subject}
          Log: ${RUN_URL}"
          else
            text="✅ LONJOBOKO-RESCUE: tes lulus dan build selesai.
          Commit: ${short_sha} · ${subject}
          Server akan memperbarui web dalam ±5 menit."
          fi

          curl -s -o /dev/null --max-time 15 \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" || echo "Gagal mengirim notifikasi Telegram."
